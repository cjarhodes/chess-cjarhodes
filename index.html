<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Opening Library — Alex Rhodes</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='12' fill='%231a1916'/%3E%3Ctext y='.9em' font-size='82' text-anchor='middle' x='50' dominant-baseline='middle' dy='.1em'%3E♛%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #111110;
      --surface: #1a1916;
      --surface2: #21201d;
      --text: #e8e5de;
      --muted: #6b6860;
      --border: #2a2825;
      --accent: #c9a96e;
      --accent-dim: rgba(201,169,110,0.15);
      --success: #4a7c59;
      --success-bg: rgba(74,124,89,0.15);
      --error: #8a3a3a;
      --error-bg: rgba(138,58,58,0.15);
      --white-cat: #f0d9b5;
      --black-cat: #b58863;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── HEADER ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 2rem;
      display: flex;
      align-items: baseline;
      gap: 1.5rem;
    }
    header a.back {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }
    header a.back:hover { color: var(--text); }
    header h1 {
      font-family: 'EB Garamond', serif;
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 0.01em;
    }
    header .subtitle {
      color: var(--muted);
      font-size: 0.85rem;
      margin-left: auto;
    }

    /* ── LAYOUT ── */
    .app {
      display: grid;
      grid-template-columns: 240px 1fr 300px;
      grid-template-rows: 1fr;
      min-height: calc(100vh - 65px);
    }

    /* ── LIBRARY SIDEBAR ── */
    .library {
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 1.5rem 0;
    }
    .library-section { margin-bottom: 1.5rem; }
    .library-label {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 1.25rem 0.5rem;
    }
    .opening-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.5rem 1.25rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      font-size: 0.85rem;
      color: var(--muted);
      transition: color 0.15s, background 0.15s;
      border-left: 2px solid transparent;
    }
    .opening-btn:hover { color: var(--text); background: var(--surface); }
    .opening-btn.active {
      color: var(--accent);
      background: var(--accent-dim);
      border-left-color: var(--accent);
    }
    .opening-btn .eco {
      font-size: 0.7rem;
      opacity: 0.6;
      margin-left: 0.5rem;
    }

    /* ── BOARD AREA ── */
    .board-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 1.25rem;
    }

    .mode-toggle {
      display: flex;
      gap: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .mode-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 400;
      padding: 0.4rem 1rem;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.03em;
    }
    .mode-btn.active { background: var(--surface2); color: var(--text); }
    .mode-btn:not(.active):hover { color: var(--text); }

    #board-wrap {
      position: relative;
    }

    #myBoard {
      width: 440px;
    }

    /* chessboard.js overrides */
    .board-b72b1 { border: 1px solid var(--border) !important; border-radius: 4px; overflow: hidden; }

    .feedback-bar {
      width: 440px;
      min-height: 44px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.2s;
      gap: 0.5rem;
    }
    .feedback-bar.show { opacity: 1; }
    .feedback-bar.correct { background: var(--success-bg); color: #6dbd8a; border: 1px solid rgba(74,124,89,0.3); }
    .feedback-bar.incorrect { background: var(--error-bg); color: #cd7b7b; border: 1px solid rgba(138,58,58,0.3); }
    .feedback-bar.hint { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(201,169,110,0.3); }

    .board-controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .ctrl-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      padding: 0.4rem 0.9rem;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .ctrl-btn:hover { background: var(--surface2); border-color: var(--muted); }
    .ctrl-btn:disabled { opacity: 0.3; cursor: default; }
    .ctrl-btn.flip { font-size: 1rem; padding: 0.4rem 0.7rem; }

    .progress-bar {
      width: 440px;
      height: 2px;
      background: var(--border);
      border-radius: 1px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 1px;
      transition: width 0.3s ease;
      width: 0%;
    }

    /* ── INFO PANEL ── */
    .info-panel {
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .opening-title {
      font-family: 'EB Garamond', serif;
      font-size: 1.3rem;
      font-weight: 400;
      color: var(--text);
      line-height: 1.3;
    }
    .opening-tagline {
      font-size: 0.8rem;
      color: var(--accent);
      margin-top: 0.2rem;
      font-style: italic;
    }
    .opening-desc {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .section-label {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    /* Move list */
    .move-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
    }
    .move-pair {
      display: flex;
      align-items: center;
      gap: 0.2rem;
    }
    .move-num {
      font-size: 0.7rem;
      color: var(--muted);
      min-width: 1.2rem;
    }
    .move-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.2rem 0.5rem;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      transition: all 0.15s;
      user-select: none;
    }
    .move-chip:hover { background: var(--surface2); color: var(--text); }
    .move-chip.current {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }
    .move-chip.played {
      color: var(--text);
    }

    /* Explanation box */
    .explanation-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
      font-size: 0.82rem;
      line-height: 1.65;
      color: var(--muted);
      min-height: 80px;
      transition: all 0.2s;
    }
    .explanation-box .move-label {
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 0.4rem;
      display: block;
    }
    .explanation-box p { color: var(--text); }

    /* Key ideas */
    .key-ideas { display: flex; flex-direction: column; gap: 0.4rem; }
    .key-idea {
      font-size: 0.78rem;
      color: var(--muted);
      padding-left: 0.8rem;
      border-left: 1px solid var(--border);
      line-height: 1.4;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 0.75rem;
      opacity: 0.4;
      text-align: center;
    }
    .empty-state .icon { font-size: 2.5rem; }
    .empty-state p { font-size: 0.85rem; color: var(--muted); }

    .board-empty-state {
      width: 440px;
      height: 440px;
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.75rem;
      opacity: 0.35;
    }
    .board-empty-state .icon { font-size: 3rem; }
    .board-empty-state p { font-size: 0.85rem; color: var(--muted); }

    /* Quiz mode badge */
    .quiz-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid rgba(201,169,110,0.3);
      border-radius: 4px;
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      font-weight: 400;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto; }
      .library { border-right: none; border-bottom: 1px solid var(--border); padding: 1rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
      .library-section { margin-bottom: 0; }
      .library-label { display: none; }
      .opening-btn { border-radius: 4px; border-left: none; border: 1px solid var(--border); padding: 0.35rem 0.75rem; width: auto; display: inline-block; }
      .info-panel { border-left: none; border-top: 1px solid var(--border); }
      #myBoard { width: 90vw; max-width: 440px; }
      .feedback-bar, .progress-bar { width: 90vw; max-width: 440px; }
    }
  </style>
</head>
<body>

<header>
  <a class="back" href="https://cjarhodes.com">← cjarhodes.com</a>
  <h1>Chess Opening Library</h1>
  <span class="subtitle">Study · Drill · Master</span>
</header>

<div class="app">

  <!-- ── LIBRARY SIDEBAR ── -->
  <aside class="library" id="library">
    <div class="library-section">
      <div class="library-label">White Openings</div>
      <button class="opening-btn" data-id="italian">Italian Game <span class="eco">C50</span></button>
      <button class="opening-btn" data-id="ruy-lopez">Ruy López <span class="eco">C60</span></button>
      <button class="opening-btn" data-id="queens-gambit">Queen's Gambit <span class="eco">D06</span></button>
      <button class="opening-btn" data-id="london">London System <span class="eco">D02</span></button>
    </div>
    <div class="library-section">
      <div class="library-label">Black Defenses</div>
      <button class="opening-btn" data-id="sicilian">Sicilian Defense <span class="eco">B20</span></button>
      <button class="opening-btn" data-id="french">French Defense <span class="eco">C00</span></button>
      <button class="opening-btn" data-id="caro-kann">Caro-Kann <span class="eco">B10</span></button>
      <button class="opening-btn" data-id="kings-indian">King's Indian <span class="eco">E60</span></button>
    </div>
    <div class="library-section">
      <div class="library-label">Gambits</div>
      <button class="opening-btn" data-id="kings-gambit">King's Gambit <span class="eco">C30</span></button>
      <button class="opening-btn" data-id="evans-gambit">Evans Gambit <span class="eco">C51</span></button>
    </div>
  </aside>

  <!-- ── BOARD AREA ── -->
  <main class="board-area">
    <div class="mode-toggle">
      <button class="mode-btn active" id="btn-study">Study</button>
      <button class="mode-btn" id="btn-quiz">Quiz</button>
    </div>

    <div id="board-wrap">
      <div id="myBoard"></div>
      <div id="board-placeholder" class="board-empty-state">
        <div class="icon">♟</div>
        <p>Select an opening to begin</p>
      </div>
    </div>

    <div class="feedback-bar" id="feedback-bar"></div>

    <div class="board-controls">
      <button class="ctrl-btn" id="btn-start" disabled title="To start">«</button>
      <button class="ctrl-btn" id="btn-prev" disabled>← Prev</button>
      <button class="ctrl-btn" id="btn-next" disabled>Next →</button>
      <button class="ctrl-btn" id="btn-end" disabled title="To end">»</button>
      <button class="ctrl-btn flip" id="btn-flip" disabled title="Flip board">⇅</button>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  </main>

  <!-- ── INFO PANEL ── -->
  <aside class="info-panel" id="info-panel">
    <div class="empty-state" id="empty-state">
      <div class="icon">♛</div>
      <p>Choose an opening from the library to start learning</p>
    </div>
    <div id="opening-content" style="display:none; flex-direction:column; gap:1.25rem;">
      <div>
        <div class="opening-title" id="opening-title"></div>
        <div class="opening-tagline" id="opening-tagline"></div>
      </div>
      <div class="opening-desc" id="opening-desc"></div>

      <div>
        <div class="section-label">Moves</div>
        <div class="move-list" id="move-list"></div>
      </div>

      <div>
        <div class="section-label" id="exp-label">Explanation</div>
        <div class="explanation-box" id="explanation-box">
          <p>Click a move or use Next → to step through the opening.</p>
        </div>
      </div>

      <div>
        <div class="section-label">Key Ideas</div>
        <div class="key-ideas" id="key-ideas"></div>
      </div>
    </div>
  </aside>

</div>

<!-- Scripts: jQuery first, then chess.js, then chessboard.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

<script>
// ─────────────────────────────────────────────
// OPENING DATA
// ─────────────────────────────────────────────
const OPENINGS = [
  {
    id: 'italian',
    name: 'Italian Game',
    eco: 'C50',
    category: 'white',
    tagline: 'Classical development and early f7 pressure',
    description: 'One of the oldest openings in chess, dating to the 16th century. The Italian Game focuses on rapid development, central control with e4+d3, and long-term structural advantages. The Bc4 bishop eyes the f7 pawn — Black\'s most vulnerable point early in the game. The Modern Italian (c3 + d3) is the current top-level choice for White.',
    moves: ['e4', 'e5', 'Nf3', 'Nc6', 'Bc4', 'Bc5', 'c3', 'Nf6', 'd3', 'd6', 'O-O', 'O-O', 'Re1', 'a6', 'a4', 'Ba7', 'h3', 'h6', 'Nbd2', 'Re8', 'Nf1', 'Be6', 'Bxe6', 'Rxe6', 'Ng3', 'Qd7'],
    explanations: [
      { label: '1. e4 — White', text: 'The King\'s Pawn — the most popular first move in all of chess. It immediately stakes a claim in the center, opens lines for the queen and bishop, and prepares rapid castling. Bobby Fischer called it "best by test."' },
      { label: '1... e5 — Black', text: 'The symmetrical response. Black mirrors White\'s central claim, contesting the center immediately. This is one of Black\'s most solid and time-tested replies — known as Open Game territory.' },
      { label: '2. Nf3 — White', text: 'The knight develops to its most natural square, simultaneously attacking Black\'s e5 pawn and preparing to castle kingside. Following the classical principle: "Knights before bishops."' },
      { label: '2... Nc6 — Black', text: 'The most natural defense — the knight defends e5 and comes to a strong central square. Black develops with purpose.' },
      { label: '3. Bc4 — White', text: 'The Italian bishop! White aims at f7 — the weakest square in Black\'s position (defended only by the king). This bishop is tremendously active.' },
      { label: '3... Bc5 — Black', text: 'Black mirrors White\'s development, placing the bishop on the powerful c5 diagonal. This symmetrical setup leads to the Giuoco Piano ("quiet game") — though it\'s far from quiet!' },
      { label: '4. c3 — White', text: 'The Modern Italian begins. White prepares d4 to grab the center. c3 also gives the queen a potential square on c2, and the pawn will support the d4 advance.' },
      { label: '4... Nf6 — Black', text: 'Black continues development rather than allowing d4 immediately. The Nf6 attacks e4, forcing White to defend it.' },
      { label: '5. d3 — White', text: 'White chooses the "slow" Italian setup — d3 instead of d4. This leads to a more positional battle. White will maneuver pieces to ideal squares before launching any pawn breaks.' },
      { label: '5... d6 — Black', text: 'Solid and sensible — Black supports the e5 pawn and prepares to complete development. The position is solid and roughly balanced.' },
      { label: '6. O-O — White', text: 'White castles, bringing the king to safety. Now all of White\'s development is focused on the kingside. The rook on f1 will be useful on the e-file after Re1.' },
      { label: '6... O-O — Black', text: 'Black also castles. Both kings are safe. The real battle begins now — slow maneuvering for ideal piece placement.' },
      { label: '7. Re1 — White', text: 'The rook eyes the e5 pawn. This classic move puts pressure on the e-file and supports the e4 pawn, preparing for future central action. Typical Italian plan.' },
      { label: '7... a6 — Black', text: 'A prophylactic move — Black prevents Bb5 (or Ba4-b3 ideas) and prepares to kick the bishop with ...b5 if needed. Typical Bc5 bishop defense.' },
      { label: '8. a4 — White', text: 'White stops ...b5 and prevents Black from pushing the bishop back. White also gains queenside space and creates pressure on the a5 square.' },
      { label: '8... Ba7 — Black', text: 'The bishop retreats to a7, a safe square outside the pawn chain. From a7, it doesn\'t do much, but it\'s also not easily attacked. Black must find other ways to activate.' },
      { label: '9. h3 — White', text: 'Prophylaxis! White prevents ...Bg4 (which would pin the Nf3 and add pressure). This quiet move is typical in slow Italian positions — secure everything before advancing.' },
      { label: '9... h6 — Black', text: 'Mirroring White\'s prophylaxis — Black prevents Bg5. Both sides are playing carefully, avoiding any weaknesses before the middlegame battle begins.' },
      { label: '10. Nbd2 — White', text: 'The knight comes to d2, heading for f1 and then e3 or g3. This "knight maneuver" is the hallmark of the Modern Italian — the knight will become a powerful piece.' },
      { label: '10... Re8 — Black', text: 'Black centralizes the rook, adding support to the e5 pawn and preparing for potential activity on the e-file. Both sides continue improving piece placement.' },
      { label: '11. Nf1 — White', text: 'The second step of White\'s knight maneuver. The Nd2 went to f1, and from here it can go to e3, g3, or even h2-g4. White\'s knights are heading to the kingside for an attack.' },
      { label: '11... Be6 — Black', text: 'Black\'s bishop becomes active, eying the c4 bishop and fighting for the d5 square. This also prepares ...d5 as a central break if conditions are right.' },
      { label: '12. Bxe6 — White', text: 'White exchanges the Italian bishop for Black\'s active Be6. This simplifies somewhat and removes the potentially dangerous bishop. White gets the bishop pair advantage.' },
      { label: '12... Rxe6 — Black', text: 'The rook recaptures on e6, becoming centralized and active. The rook on e6 is powerful — it can shift to d6, f6, or just maintain pressure.' },
      { label: '13. Ng3 — White', text: 'The knight arrives at g3, completing the maneuver. From g3, it controls f5 and h5, and can jump to f5 if Black allows it. This is the standard Italian knight setup — both knights (g3 and f3) aim at f5.' },
      { label: '13... Qd7 — Black', text: 'Black prepares queenside operations and potential ...Rae8 doubling rooks. The queen also eyes d5 and keeps an eye on g4. A tense middlegame battle awaits.' }
    ],
    keyIdeas: [
      'Modern Italian: c3 + d3 — slow but deep positional pressure',
      'White\'s knight maneuver: Nbd2-f1-g3 (or e3) aims at f5',
      'Re1 supports e4 and pressures e5 — a typical Italian rook move',
      'Key break: d4 when ready — challenges Black\'s central pawn structure'
    ]
  },
  {
    id: 'ruy-lopez',
    name: 'Ruy López',
    eco: 'C60',
    category: 'white',
    tagline: 'The gold standard of 1.e4 openings',
    description: 'Named after a 16th-century Spanish priest, the Ruy López is one of the most deeply studied openings in chess history — hundreds of years of theory! It puts immediate pressure on the Nc6 that defends e5, creating long-term strategic tension. The Breyer Variation shown here is Magnus Carlsen\'s favorite.',
    moves: ['e4', 'e5', 'Nf3', 'Nc6', 'Bb5', 'a6', 'Ba4', 'Nf6', 'O-O', 'Be7', 'Re1', 'b5', 'Bb3', 'd6', 'c3', 'O-O', 'h3', 'Nb8', 'd4', 'Nbd7', 'Nbd2', 'Bb7', 'Bc2', 'Re8', 'Nf1', 'Bf8'],
    explanations: [
      { label: '1. e4 — White', text: 'The King\'s Pawn — White stakes a central claim immediately, opening lines for rapid piece development and kingside castling.' },
      { label: '1... e5 — Black', text: 'Black responds symmetrically, taking equal central space. A principled, classical response that leads to rich middlegame play.' },
      { label: '2. Nf3 — White', text: 'The knight attacks e5, develops naturally, and prepares to castle.' },
      { label: '2... Nc6 — Black', text: 'The most natural defense to e5 — the knight develops to an active central square and covers the pawn.' },
      { label: '3. Bb5 — White', text: 'The Ruy López! The bishop threatens Bxc6 followed by Nxe5, winning the e5 pawn. It\'s not an immediate tactic — it\'s a long-term positional pressure move.' },
      { label: '3... a6 — Black', text: 'The Morphy Defense — Black asks the bishop to declare its intentions. It\'s the most popular response, leading to the richest theory in all of chess.' },
      { label: '4. Ba4 — White', text: 'The bishop retreats to a4, maintaining the pin (or semi-pin) on the Nc6. Now if Black pushes ...b5, the bishop retreats to b3, and the battle continues.' },

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let board = null;
let game = new Chess();
let currentOpening = null;
let currentMoveIdx = -1;  // -1 = starting position
let quizMode = false;
let boardFlipped = false;
let quizAttempts = 0;
let feedbackTimeout = null;

// ─────────────────────────────────────────────
// BOARD INIT (lazy — board is created on first opening load)
// ─────────────────────────────────────────────
function createBoard(position, draggable, orientation) {
  if (board) board.destroy();
  board = Chessboard('myBoard', {
    position: position || 'start',
    draggable: !!draggable,
    orientation: orientation || 'white',
    pieceTheme: function(piece) {
      var svgMap = {
        bB: 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg',
        bK: 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg',
        bN: 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
        bP: 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg',
        bQ: 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg',
        bR: 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg',
        wB: 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',
        wK: 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg',
        wN: 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
        wP: 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg',
        wQ: 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg',
        wR: 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg'
      };
      return svgMap[piece];
    },
    onDrop: handleDrop,
    onSnapEnd: handleSnapEnd,
  });
}

function handleDrop(source, target) {
  if (!quizMode || !currentOpening) return 'snapback';
  const nextIdx = currentMoveIdx + 1;
  if (nextIdx >= currentOpening.moves.length) return 'snapback';

  const expectedSAN = currentOpening.moves[nextIdx];

  // Try the move on a temp game
  const tempGame = new Chess(game.fen());
  const move = tempGame.move({ from: source, to: target, promotion: 'q' });
  if (!move) return 'snapback';

  if (move.san === expectedSAN) {
    game.move({ from: source, to: target, promotion: 'q' });
    currentMoveIdx = nextIdx;
    quizAttempts = 0;
    showFeedback('correct', '✓ Correct! ' + currentOpening.explanations[nextIdx].text);
    setTimeout(() => {
      board.position(game.fen());
      renderMoveList();
      updateProgress();
      updateControls();
    }, 300);
  } else {
    quizAttempts++;
    if (quizAttempts >= 2) {
      showFeedback('hint', '💡 The correct move is ' + expectedSAN);
    } else {
      showFeedback('incorrect', '✗ Not quite — try again!');
    }
    return 'snapback';
  }
}

function handleSnapEnd() {
  if (!quizMode) return;
  board.position(game.fen());
}

// ─────────────────────────────────────────────
// LOAD AN OPENING
// ─────────────────────────────────────────────
function loadOpening(id) {
  currentOpening = OPENINGS.find(o => o.id === id);
  if (!currentOpening) return;

  currentMoveIdx = -1;
  quizAttempts = 0;
  game.reset();
  boardFlipped = false;

  // Show board element first (must be visible before chessboard.js measures it)
  $('#board-placeholder').hide();
  $('#myBoard').show();
  createBoard('start', quizMode, 'white');

  // Enable controls
  ['btn-prev', 'btn-start', 'btn-flip'].forEach(id => $('#' + id).prop('disabled', true));
  ['btn-next', 'btn-end'].forEach(id => $('#' + id).prop('disabled', false));
  $('#btn-flip').prop('disabled', false);

  // Update library
  $('.opening-btn').removeClass('active');
  $(`.opening-btn[data-id="${currentOpening.id}"]`).addClass('active');

  // Update info panel
  $('#empty-state').hide();
  $('#opening-content').show();
  $('#opening-title').text(currentOpening.name);
  $('#opening-tagline').text(currentOpening.tagline);
  $('#opening-desc').text(currentOpening.description);

  renderKeyIdeas();
  renderMoveList();
  renderExplanation(-1);
  updateProgress();
  updateBoardDraggable();
  clearFeedback();
}

// ─────────────────────────────────────────────
// NAVIGATION
// ─────────────────────────────────────────────
function goToMove(idx) {
  if (!currentOpening || !board) return;
  idx = Math.max(-1, Math.min(idx, currentOpening.moves.length - 1));
  game.reset();
  for (let i = 0; i <= idx; i++) {
    game.move(currentOpening.moves[i]);
  }
  currentMoveIdx = idx;
  board.position(idx === -1 ? 'start' : game.fen(), false);
  renderMoveList();
  renderExplanation(idx);
  updateProgress();
  updateControls();
  quizAttempts = 0;
  if (!quizMode) clearFeedback();
}

function updateControls() {
  const atStart = currentMoveIdx <= -1;
  const atEnd = currentOpening && currentMoveIdx >= currentOpening.moves.length - 1;
  $('#btn-prev').prop('disabled', atStart);
  $('#btn-start').prop('disabled', atStart);
  $('#btn-next').prop('disabled', atEnd || !currentOpening);
  $('#btn-end').prop('disabled', atEnd || !currentOpening);
}

// ─────────────────────────────────────────────
// RENDER FUNCTIONS
// ─────────────────────────────────────────────
function renderMoveList() {
  if (!currentOpening) return;
  const moves = currentOpening.moves;
  let html = '';
  for (let i = 0; i < moves.length; i += 2) {
    const moveNum = Math.floor(i / 2) + 1;
    html += `<div class="move-pair">`;
    html += `<span class="move-num">${moveNum}.</span>`;
    // White move
    const wClass = i === currentMoveIdx ? 'current' : (i < currentMoveIdx ? 'played' : '');
    html += `<button class="move-chip ${wClass}" data-idx="${i}">${moves[i]}</button>`;
    // Black move (if exists)
    if (i + 1 < moves.length) {
      const bClass = (i + 1) === currentMoveIdx ? 'current' : (i + 1 < currentMoveIdx ? 'played' : '');
      html += `<button class="move-chip ${bClass}" data-idx="${i + 1}">${moves[i + 1]}</button>`;
    }
    html += `</div>`;
  }
  $('#move-list').html(html);

  // Click handlers for move chips
  $('.move-chip').on('click', function () {
    if (quizMode) return; // no clicking in quiz mode
    const idx = parseInt($(this).data('idx'));
    goToMove(idx);
  });
}

function renderExplanation(idx) {
  const box = $('#explanation-box');
  if (idx < 0 || !currentOpening) {
    if (quizMode) {
      const next = currentOpening ? currentOpening.moves[0] : '?';
      box.html(`<span class="move-label">Quiz Mode Active</span><p>Find the correct move on the board. Drag the right piece to the right square.</p>`);
    } else {
      box.html(`<p>Click a move or use <strong>Next →</strong> to step through the opening.</p>`);
    }
    return;
  }
  const exp = currentOpening.explanations[idx];
  box.html(`<span class="move-label">${exp.label}</span><p>${exp.text}</p>`);
}

function renderKeyIdeas() {
  if (!currentOpening) return;
  const html = currentOpening.keyIdeas.map(idea => `<div class="key-idea">${idea}</div>`).join('');
  $('#key-ideas').html(html);
}

function updateProgress() {
  if (!currentOpening) { $('#progress-fill').css('width', '0%'); return; }
  const pct = ((currentMoveIdx + 1) / currentOpening.moves.length) * 100;
  $('#progress-fill').css('width', pct + '%');
}

// ─────────────────────────────────────────────
// QUIZ MODE
// ─────────────────────────────────────────────
function updateBoardDraggable() {
  if (!board) return;
  createBoard(game.fen(), quizMode, boardFlipped ? 'black' : 'white');
}

function setMode(mode) {
  quizMode = (mode === 'quiz');
  if (quizMode) {
    $('#btn-study').removeClass('active');
    $('#btn-quiz').addClass('active');
    $('#btn-next, #btn-prev, #btn-start, #btn-end').prop('disabled', true);
    // Reset to beginning for quiz
    if (currentOpening) {
      game.reset();
      currentMoveIdx = -1;
      board.position('start');
      renderMoveList();
      renderExplanation(-1);
      updateProgress();
      quizAttempts = 0;
      clearFeedback();
      showFeedback('hint', '💡 Drag the correct piece to play each move in the opening.');
    }
  } else {
    $('#btn-study').addClass('active');
    $('#btn-quiz').removeClass('active');
    if (currentOpening) updateControls();
    renderExplanation(currentMoveIdx);
    clearFeedback();
  }
  updateBoardDraggable();
}

// ─────────────────────────────────────────────
// FEEDBACK
// ─────────────────────────────────────────────
function showFeedback(type, message) {
  const bar = $('#feedback-bar');
  bar.removeClass('correct incorrect hint').addClass(type + ' show').text(message);
  if (feedbackTimeout) clearTimeout(feedbackTimeout);
  if (type === 'correct') {
    feedbackTimeout = setTimeout(clearFeedback, 5000);
  }
}

function clearFeedback() {
  $('#feedback-bar').removeClass('show correct incorrect hint');
}

// ─────────────────────────────────────────────
// EVENT HANDLERS
// ─────────────────────────────────────────────
$(function () {
  // Board is initialized lazily on first opening selection

  // Library buttons
  $('.opening-btn').on('click', function () {
    loadOpening($(this).data('id'));
  });

  // Navigation
  $('#btn-prev').on('click', () => goToMove(currentMoveIdx - 1));
  $('#btn-next').on('click', () => goToMove(currentMoveIdx + 1));
  $('#btn-start').on('click', () => goToMove(-1));
  $('#btn-end').on('click', () => { if (currentOpening) goToMove(currentOpening.moves.length - 1); });

  // Flip board
  $('#btn-flip').on('click', function () {
    if (!currentOpening) return;
    boardFlipped = !boardFlipped;
    board.flip();
  });

  // Mode toggle
  $('#btn-study').on('click', () => setMode('study'));
  $('#btn-quiz').on('click', () => { if (currentOpening) setMode('quiz'); });

  // Keyboard navigation
  $(document).on('keydown', function (e) {
    if (quizMode) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      if (!$('#btn-next').prop('disabled')) goToMove(currentMoveIdx + 1);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!$('#btn-prev').prop('disabled')) goToMove(currentMoveIdx - 1);
    }
  });
});
</script>

</body>
</html>
